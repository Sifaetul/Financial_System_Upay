version: '3.8'
services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: upay
      POSTGRES_PASSWORD: upay_password
      POSTGRES_DB: upay_nexus
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U upay
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
    ports:
    - 8000:8000
    environment:
    - DATABASE_URI=postgresql+psycopg2://upay:upay_password@postgres:5432/upay_nexus
    - REDIS_URI=redis://redis:6379/0
    - ENVIRONMENT=production
    - SECRET_KEY=prod_super_secure_secret_key_12345
    - ALLOW_LOCALHOST_DB=1
    - JWT_SECRET=production_secret_key_change_me_to_be_secure_32_bytes_long
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 5
  celery_worker:
    build:
      context: ./backend
    command:
    - celery
    - -A
    - app.worker.celery_app
    - worker
    - --loglevel=info
    environment:
    - DATABASE_URI=postgresql+psycopg2://upay:upay_password@postgres:5432/upay_nexus
    - REDIS_URI=redis://redis:6379/0
    - ENVIRONMENT=production
    - SECRET_KEY=prod_super_secure_secret_key_12345
    - ALLOW_LOCALHOST_DB=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  celery_beat:
    build:
      context: ./backend
    command:
    - celery
    - -A
    - app.worker.celery_app
    - beat
    - --loglevel=info
    environment:
    - DATABASE_URI=postgresql+psycopg2://upay:upay_password@postgres:5432/upay_nexus
    - REDIS_URI=redis://redis:6379/0
    - ENVIRONMENT=production
    - SECRET_KEY=prod_super_secure_secret_key_12345
    - ALLOW_LOCALHOST_DB=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
    ports:
    - 3000:3000
    environment:
    - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
    - backend
  nginx:
    image: nginx:alpine
    ports:
    - 80:80
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - frontend
    - backend
volumes:
  pgdata: null
